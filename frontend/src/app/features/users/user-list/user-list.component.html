<section class="page" aria-labelledby="users-title">
  <header class="page-header">
    <h1 id="users-title">Users</h1>
  </header>

  <div class="table-container">
    <table mat-table [dataSource]="users()" class="users-table" aria-describedby="users-title">
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef scope="col">Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef scope="col">Name</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef scope="col">Role</th>
        <td mat-cell *matCellDef="let user">{{ user.role }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef scope="col">Created</th>
        <td mat-cell *matCellDef="let user">{{ user.createdAt | date: 'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef scope="col"><span class="visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let user" class="actions">
          <a mat-button routerLink="/alerts" [queryParams]="{ userId: user.id }">Alerts</a>
          @if (user.id !== currentUserId) {
            <button mat-button type="button" class="delete" (click)="deleteUser(user)">Delete</button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>

  <mat-paginator
    [length]="totalElements()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (page)="changePage($event)"
    aria-label="Choose a users page"
  />
</section>
